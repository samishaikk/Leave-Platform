name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leave_user
          POSTGRES_PASSWORD: leave_pass
          POSTGRES_DB: leave_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leave_user -d leave_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://leave_user:leave_pass@localhost:5432/leave_test_db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit, API and SQL tests (coverage gate 80%)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: pytest -m e2e --screenshot only-on-failure --tracing retain-on-failure

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Check readiness
        run: curl --fail --silent http://localhost:8001/ready

      - name: Log in as a seeded user
        run: >-
          curl --fail --silent
          --data-urlencode 'username=meera@example.com'
          --data-urlencode 'password=Password123!'
          http://localhost:8001/auth/login

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v