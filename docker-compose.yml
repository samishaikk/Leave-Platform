services:
  db:
    image: postgres:16
    container_name: leave_db
    environment:
      POSTGRES_USER: leave_user
      POSTGRES_PASSWORD: leave_pass
      POSTGRES_DB: leave_db
    ports:
      - "5434:5432"
    volumes:
      - leave_pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leave_user -d leave_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  leave_pgdata: