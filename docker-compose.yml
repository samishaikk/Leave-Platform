services:
  db:
    image: postgres:16
    container_name: leave_db
    environment:
      POSTGRES_USER: leave_user
      POSTGRES_PASSWORD: leave_pass
      POSTGRES_DB: leave_db
    ports:
      - "5434:5432"
    volumes:
      - leave_pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leave_user -d leave_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: leave_api
    environment:
      DATABASE_URL: postgresql+psycopg2://leave_user:leave_pass@db:5432/leave_db
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-change-in-production}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    # demo setup: creates the tables and adds sample users, then starts the app
    command: ["sh", "-c", "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  leave_pgdata: