{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section style="max-width: 380px; margin: 40px auto;">
  <h1>Log in</h1>
  <form method="post" action="/login" data-testid="login-form">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required data-testid="login-email">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required data-testid="login-password">
    <p><button type="submit" data-testid="login-submit">Log in</button></p>
  </form>
</section>
{% endblock %}
